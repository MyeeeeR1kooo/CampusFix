# Use with the root compose file. Only the one-off API test container changes.
services:
  api:
    image: campusfix-api:test
    build:
      target: test
    environment:
      CAMPUSFIX_TEST_DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      # Existing backend test requests use the Vite development origin.
      ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - ./docs:/docs:ro
    command: [pytest, -q]
