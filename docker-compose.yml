name: campusfix

x-backend: &backend
  image: campusfix-api:local
  build:
    context: ./backend
    target: runtime
  environment: &backend-environment
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    ENVIRONMENT: local
    SECURE_COOKIES: "false"
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    ATTACHMENT_STORAGE_PATH: /data/attachments
    SESSION_LIFETIME_SECONDS: "28800"
    TZ: UTC

services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusfix}
      POSTGRES_USER: ${POSTGRES_USER:-campusfix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      <<: *backend-environment
      SEED_REPORTER_PASSWORD: ${SEED_REPORTER_PASSWORD:-}
      SEED_TECHNICIAN_PASSWORD: ${SEED_TECHNICIAN_PASSWORD:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
      args:
        FRONTEND_DIST: ${FRONTEND_DIST:-deploy/web/bootstrap}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  database:
  attachments:
