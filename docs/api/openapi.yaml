    LocationList:
      description: 地点按 created_at DESC, id DESC 稳定分页；级联控件需读取所有游标页再派生选项。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LocationList'
          examples:
            active:
              $ref: '#/components/examples/LocationList'
            empty:
              value: {items: [], next_cursor: null}
    BadRequest:
      description: 400 / VALIDATION_ERROR，请求格式或游标不正确。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: {error: {code: VALIDATION_ERROR, message: Malformed request., request_id: req_example, field_errors: []}}
    Unauthorized:
      description: 401 / UNAUTHORIZED，未登录、会话过期/失效或账户停用；登录失败使用统一提示。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: {error: {code: UNAUTHORIZED, message: Authentication failed., request_id: req_example, field_errors: []}}
    Forbidden:
      description: |
        403。FORBIDDEN（角色或资源关系不允许该动作）或 ORIGIN_NOT_ALLOWED（写请求来源不允许）。
        下面两个示例只表示这两种错误的形状，不代表每个引用它的操作都会产生两种：
        GET/HEAD/OPTIONS 不校验 Origin，只可能返回 FORBIDDEN；匿名端点（login）没有角色要求，
        只可能返回 ORIGIN_NOT_ALLOWED。各操作的实际触发条件以该操作自己的 description 为准。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            role:
              value: {error: {code: FORBIDDEN, message: This action is not allowed., request_id: req_example, field_errors: []}}
            origin:
              value: {error: {code: ORIGIN_NOT_ALLOWED, message: The request origin is not allowed., request_id: req_example, field_errors: []}}
    NotFound:
      description: 404 / NOT_FOUND，对当前用户不可见的资源与不存在资源使用相同语义。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: {error: {code: NOT_FOUND, message: Resource not found., request_id: req_example, field_errors: []}}
    Conflict:
      description: |
        409。TICKET_VERSION_CONFLICT（客户端提交的 expected_version 已过期）或 CONFLICT
        （状态不允许、唯一约束冲突、终态工单新增留言、所选地点已停用）。
        下面两个示例只表示这两种错误的形状，不代表每个引用它的操作都会产生两种：
        只有携带 expected_version 的状态动作才可能返回 TICKET_VERSION_CONFLICT；
        创建类操作（POST /api/tickets、POST /api/admin/locations）没有版本可冲突。
        各操作的实际触发条件以该操作自己的 description 为准。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            version:
              value: {error: {code: TICKET_VERSION_CONFLICT, message: The ticket has already been updated., request_id: req_example, field_errors: []}}
            state:
              value: {error: {code: CONFLICT, message: This action is not allowed in the current state., request_id: req_example, field_errors: []}}
    ContentTooLarge:
      description: 413 / VALIDATION_ERROR，单张文件超过 5 MiB；用 HTTP 状态区分，不新增 Core 枚举。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: {error: {code: VALIDATION_ERROR, message: Image exceeds 5 MiB., request_id: req_example, field_errors: []}}
    UnsupportedMediaType:
      description: 415 / VALIDATION_ERROR，实际文件内容不是 JPEG / PNG / WebP，或业务端点的 Content-Type 不支持。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: {error: {code: VALIDATION_ERROR, message: Unsupported image type., request_id: req_example, field_errors: []}}
    AssignValidationError:
      description: |
        422 / VALIDATION_ERROR，分派字段校验失败。technician_id 对应账户不存在、
        角色不是 TECHNICIAN 或已停用时，field_errors 指向 technician_id，要求重新选择。
        也适用于必填字段缺失、ID 或 expected_version 格式不合法等输入校验失败。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_field:
              value: {error: {code: VALIDATION_ERROR, message: Request validation failed., request_id: req_example, field_errors: [{field: technician_id, message: Field required, type: missing}]}}
            technician_not_found:
              summary: 所选账户不存在
              value: {error: {code: VALIDATION_ERROR, message: Select an available technician., request_id: req_example, field_errors: [{field: technician_id, message: The selected account does not exist., type: value_error}]}}
            technician_wrong_role:
              summary: 所选账户不是 Technician
              value: {error: {code: VALIDATION_ERROR, message: Select an available technician., request_id: req_example, field_errors: [{field: technician_id, message: The selected account is not a technician., type: value_error}]}}
            technician_inactive:
              summary: 所选 Technician 已停用
              value: {error: {code: VALIDATION_ERROR, message: Select an available technician., request_id: req_example, field_errors: [{field: technician_id, message: The selected technician is inactive., type: value_error}]}}
    ValidationError:
      description: 422 / VALIDATION_ERROR，字段校验、损坏图片或图片数量校验失败。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed.
              request_id: req_example
              field_errors: [{field: title, message: Field required, type: missing}]
    InternalError:
      description: 500 / INTERNAL_ERROR，安全的通用提示，不泄露 SQL、堆栈、数据库约束名称、密钥或存储路径。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: {error: {code: INTERNAL_ERROR, message: An unexpected error occurred., request_id: req_example, field_errors: []}}
