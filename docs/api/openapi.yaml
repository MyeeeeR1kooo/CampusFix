        assigned_by:
          $ref: '#/components/schemas/UserSummary'
        assigned_at:
          $ref: '#/components/schemas/UtcDateTime'
        ended_at: {type: 'null', description: P0 无重新分派；关闭后也保持 null。}
        reason: {type: [string, 'null']}
    TicketEvent:
      type: object
      additionalProperties: false
      required: [kind, id, ticket_id, actor, type, from_status, to_status, note, visibility, created_at]
      properties:
        kind: {type: string, const: EVENT}
        id:
          $ref: '#/components/schemas/Id'
        ticket_id:
          $ref: '#/components/schemas/Id'
        actor:
          $ref: '#/components/schemas/UserSummary'
        type:
          $ref: '#/components/schemas/EventType'
        from_status:
          anyOf:
            - $ref: '#/components/schemas/TicketStatus'
            - type: 'null'
          description: 提交事件的 from_status 为 null。
        to_status:
          $ref: '#/components/schemas/TicketStatus'
        note: {type: [string, 'null']}
        visibility:
          $ref: '#/components/schemas/Visibility'
        created_at:
          $ref: '#/components/schemas/UtcDateTime'
    Comment:
      type: object
      additionalProperties: false
      required: [kind, id, ticket_id, author, body, visibility, created_at]
      properties:
        kind: {type: string, const: COMMENT}
        id:
          $ref: '#/components/schemas/Id'
        ticket_id:
          $ref: '#/components/schemas/Id'
        author:
          $ref: '#/components/schemas/UserSummary'
        body: {type: string, minLength: 1, maxLength: 2000}
        visibility:
          $ref: '#/components/schemas/Visibility'
        created_at:
          $ref: '#/components/schemas/UtcDateTime'
    Location:
      type: object
      additionalProperties: false
      required: [id, building, floor, room_or_area, active, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        building: {type: string, minLength: 1}
        floor: {type: string, minLength: 1}
        room_or_area: {type: string, minLength: 1}
        active: {type: boolean}
        created_at:
          $ref: '#/components/schemas/UtcDateTime'
        updated_at:
          $ref: '#/components/schemas/UtcDateTime'
    LocationList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        next_cursor: {type: [string, 'null']}
    CreateLocationRequest:
      type: object
      additionalProperties: false
      required: [building, floor, room_or_area]
      properties:
        building: {type: string, minLength: 1}
        floor: {type: string, minLength: 1}
        room_or_area: {type: string, minLength: 1}
        active: {type: boolean, default: true}
    UpdateLocationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        building: {type: string, minLength: 1}
        floor: {type: string, minLength: 1}
        room_or_area: {type: string, minLength: 1}
        active: {type: boolean}
    UserList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor: {type: [string, 'null']}
    UserActiveRequest:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active: {type: boolean}
    Count:
      type: integer
      minimum: 0
    Analytics:
      type: object
      additionalProperties: false
      required: [by_status, by_category, by_building, backlog_count, average_close_seconds, daily_trend]
      properties:
        by_status:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [status, count]
            properties:
              status:
                $ref: '#/components/schemas/TicketStatus'
              count:
                $ref: '#/components/schemas/Count'
        by_category:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [category, count]
            properties:
              category:
                $ref: '#/components/schemas/Category'
              count:
                $ref: '#/components/schemas/Count'
        by_building:
          type: array
          description: 按关联 locations.building 分组，不从自由文本快照反解析楼宇。
          items:
            type: object
            additionalProperties: false
            required: [building, count]
            properties:
              building: {type: string}
              count:
                $ref: '#/components/schemas/Count'
        backlog_count:
          $ref: '#/components/schemas/Count'
        average_close_seconds:
          type: number
          minimum: 0
          description: 创建至关闭总耗时（秒）；无 CLOSED 样本时 0，不能称为纯维修时间。
        daily_trend:
          type: array
          minItems: 30
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [date, created_count, closed_count]
            properties:
              date: {type: string, format: date}
              created_count:
                $ref: '#/components/schemas/Count'
              closed_count:
                $ref: '#/components/schemas/Count'
