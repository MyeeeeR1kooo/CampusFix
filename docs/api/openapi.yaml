openapi: 3.1.0
info:
  title: CampusFix P0 API
  version: 1.0.0
  description: |
    Issue #46 的 v1.0 待评审契约，以 P0 冻结基线为需求依据。
    版本号不表示人工评审或冻结已完成；冻结状态见 README.md。
    生产业务端点均以 /api 为前缀；/health 保留现有 Core 的部署检查地址。
    使用同源 Cookie 会话，所有写请求（包括登录）必须携带允许的 Origin。
    所有受保护请求检查会话绝对有效期（8 小时）及用户 active 状态。
    HTTP 状态表示错误类别，error.code 完全复用 core/errors.py 的八个枚举值。
    只有 Workflow 可以改变工单状态；状态、版本、分派、关闭时间、事件同事务提交。
    当前仅 /health 已实现。此文件定义后续业务实现目标，不代表端点已经可用。
  license:
    name: MIT
x-contract-status: pending-review
x-baseline: docs/superpowers/specs/CampusFix P0 Requirements & Design Baseline.md
servers:
  - url: /
    description: 同源 Web / API；开发环境使用 Vite /api 代理。
security:
  - SessionCookie: []
tags:
  - name: Health
  - name: Auth
  - name: Tickets
  - name: Workflow
  - name: Comments
  - name: Attachments
  - name: Locations
  - name: Users
  - name: Analytics
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Core 存活检查
      description: 复用现有端点；不访问数据库，不表示迁移、业务或前端已就绪。
      security: []
      responses:
        '200':
          description: API 进程可响应。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example: {status: ok}
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 登录
      security: []
      description: |
        三类预置演示账户均可登录。账户不存在、密码错误、账户停用均使用
        401 / UNAUTHORIZED 和相同提示，不泄露账户是否存在。
        生成高熵随机令牌，只在数据库保存哈希。原始令牌仅写入 Cookie。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example: {email: reporter@example.invalid, password: demo-password}
      responses:
        '200':
          description: 登录成功，正文为当前用户，不包含令牌或密码散列。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                reporter:
                  $ref: '#/components/examples/Reporter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 退出当前会话
      description: 删除当前 sessions 记录并用同样的 Path / 安全属性清除 Cookie。
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: 退出成功，没有响应正文。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 当前有效会话的用户
      responses:
        '200':
          $ref: '#/components/responses/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tickets:
    post:
      tags: [Tickets]
      operationId: createTicket
      summary: Reporter 创建工单和可选现场图片
      description: |
        仅 REPORTER；location_id 必须为启用地点，category 使用固定枚举。
        创建后 status=SUBMITTED、version=1、priority=null、current_assignee=null、closed_at=null。
        code 为 CF-YYYYMMDD-NNNNNN：YYYYMMDD 取创建时刻的 Asia/Shanghai 本地日期
        （与统计趋势日期同一时区，不是 UTC），尾号用数据库生成的工单 ID，至少补足六位。
        保存地点名称快照，并通过 Workflow 协作写入一条 TICKET_SUBMITTED 公开事件。
        所有图片事务外先暂存校验；元数据、工单、事件与文件移动成功后提交，失败回滚并清理。
        即使没有图片也使用 multipart/form-data。无独立附件上传或工单删除端点。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
            example: {title: 教室照明闪烁, description: 示例教室灯具持续闪烁。, category: LIGHTING_ELECTRICAL, location_id: 1}
            encoding:
              photos:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: 工单已创建，返回完整摘要和当前版本。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              description: 新工单详情的相对 URI。
              schema: {type: string, example: /api/tickets/1}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSummary'
              examples:
                submitted:
                  $ref: '#/components/examples/SubmittedTicket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Tickets]
      operationId: listTickets
      summary: 查询当前用户可见工单
      description: |
        REPORTER 仅见本人创建的；TECHNICIAN 仅见当前分配给自己的，包含关闭历史；ADMIN 可见全部。
        可见范围必须在查询和分页前施加，客户端参数不能扩大范围。
        七类筛选以 AND 组合；按 created_at DESC, id DESC 排序。
        cursor 为含这两个排序字段的不透明游标，分页期间保持相同筛选条件。
        created_from 含边界、created_before 不含边界，均为 UTC 时间。
        building 按关联地点的楼宇筛选；历史显示仍使用 location_label_snapshot。
        q 匹配工单编号或标题；无匹配返回 items=[]、next_cursor=null。
        current_assignee_id 筛选仅 ADMIN 可用，其他角色传入时返回 403。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/Category'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/Priority'
        - name: building
          in: query
          schema: {type: string, minLength: 1}
        - name: created_from
          in: query
          schema:
            $ref: '#/components/schemas/UtcDateTime'
        - name: created_before
          in: query
          schema:
            $ref: '#/components/schemas/UtcDateTime'
        - name: q
          in: query
          schema: {type: string, minLength: 1}
        - name: current_assignee_id
          in: query
          description: 仅 ADMIN 的当前维修人员筛选。
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 可见范围内的稳定游标分页。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketList'
              examples:
                submitted:
                  $ref: '#/components/examples/TicketList'
                empty:
                  value: {items: [], next_cursor: null}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Tickets]
      operationId: getTicket
      summary: 工单详情、图片和可见时间线
      description: |
        REPORTER 仅本人，TECHNICIAN 仅当前负责人（包含其关闭历史），ADMIN 全部。
        对当前用户不可见的工单与不存在工单均返回 404 / NOT_FOUND。
        时间线合并事件和留言，以 created_at ASC、kind ASC、id ASC 稳定排序。
        ADMIN_ONLY 项仅 ADMIN 下发，不能向其他角色发送后交由前端隐藏。
        allowed_actions 按角色、归属、状态动态计算；终态为空数组。当前责任方字段不代表访问权限。
        返回图片元数据和受保护的 download_url，不返回 storage_key、磁盘路径、密码、令牌或用户邮箱。
      responses:
        '200':
          description: 当前用户可见的工单详情。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
              examples:
                submitted:
                  $ref: '#/components/examples/TicketDetail'
                pending_confirmation_reporter:
                  $ref: '#/components/examples/PendingConfirmationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tickets/{id}/review:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Workflow]
      operationId: reviewTicket
      summary: Admin 审核通过或驳回
      description: |
        仅 ADMIN 且当前状态 SUBMITTED。APPROVE 必须有 category 和 priority，进入 PENDING_ASSIGNMENT。
        REJECT 必须有非空 reason，进入 REJECTED。分类和优先级在审核通过动作中确认。
        状态、version 递增和唯一对应事件在同一事务中提交。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
            examples:
              approve:
                value: {decision: APPROVE, category: LIGHTING_ELECTRICAL, priority: HIGH, expected_version: 1}
              reject:
                value: {decision: REJECT, reason: 不属于实体设施维修范围, expected_version: 1}
      responses:
        '200':
          $ref: '#/components/responses/TicketReviewed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tickets/{id}/assign:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Workflow]
      operationId: assignTicket
      summary: Admin 分派一名启用的 Technician
      description: |
        仅 ADMIN，PENDING_ASSIGNMENT → ASSIGNED。technician_id 必须属于启用的 TECHNICIAN。
        technician_id 对应账户不存在、角色不是 TECHNICIAN 或已停用，均返回 422 / VALIDATION_ERROR，
        field_errors 指向 technician_id；不以目标账户的 404 或 409 表达这些失败。
        执行分派时由后端校验；失败不改变工单状态、版本、负责人、分派记录或事件。
        工单不存在、工单状态不允许及旧版本仍按原有 404 / 409 语义处理。
        一张工单同时最多一条 ended_at IS NULL 的分派；P0 不支持重新分派。
        assignments、current_assignee_id、状态、版本与 TICKET_ASSIGNED 事件同事务提交。
        关闭后保留 current_assignee_id，ended_at 在 P0 正常流程仍为空。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'
            example: {technician_id: 2, expected_version: 2}
      responses:
        '200':
          $ref: '#/components/responses/TicketAssigned'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/AssignValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tickets/{id}/start:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Workflow]
      operationId: startTicket
      summary: 当前 Technician 开始处理
      description: 仅当前负责人，ASSIGNED → IN_PROGRESS；note 可选。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRequest'
            example: {expected_version: 3}
      responses:
        '200':
          $ref: '#/components/responses/TicketStarted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tickets/{id}/resolve:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Workflow]
      operationId: resolveTicket
      summary: 当前 Technician 提交维修说明和可选结果图片
      description: |
        IN_PROGRESS → PENDING_CONFIRMATION，resolution_note 必填。即使没有图片也使用 multipart/form-data。
        RESOLUTION_SUBMITTED 事件保存说明与提交时间；关联的结果图片可在详情与授权下载接口读取。
        文件校验、事务和失败补偿复用附件模块。结果图片用途为 RESOLUTION_PHOTO，每种用途合计最多五张。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
            example: {resolution_note: 已更换灯具并完成通电检查。, expected_version: 4}
            encoding:
              photos:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          $ref: '#/components/responses/TicketResolved'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tickets/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Workflow]
      operationId: confirmTicket
      summary: 原 Reporter 确认完成
      description: |
        PENDING_CONFIRMATION → CLOSED，设置 closed_at，version 递增，写入一条 TICKET_CLOSED 事件。
        不接受满意度或评价字段。重复旧版本请求返回 409，不能重复写入有效关闭事件。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
            example: {expected_version: 5}
      responses:
        '200':
          $ref: '#/components/responses/TicketConfirmed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tickets/{id}/rework:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Workflow]
      operationId: reworkTicket
      summary: 原 Reporter 要求返工
      description: PENDING_CONFIRMATION → IN_PROGRESS，reason 必填；写入 REWORK_REQUESTED，保留当前负责人。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReworkRequest'
            example: {expected_version: 5, reason: 灯仍然闪烁，请重新检查}
      responses:
        '200':
          $ref: '#/components/responses/TicketReworked'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tickets/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Workflow]
      operationId: cancelTicket
      summary: 原 Reporter 审核前撤销
      description: 仅 SUBMITTED → CANCELLED；reason 可选，写入 TICKET_CANCELLED 事件。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
            example: {expected_version: 1}
      responses:
        '200':
          $ref: '#/components/responses/TicketCancelled'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tickets/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Comments]
      operationId: createComment
      summary: 非终态工单新增公开留言或管理员内部备注
      description: |
        Reporter、当前 Technician、Admin 可创建 PUBLIC；只有 Admin 可创建 ADMIN_ONLY。
        工单终态返回 409 / CONFLICT。留言不改变 status 或 version，不需要 expected_version。
        所有既有留言只读，不提供修改或删除端点。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
            example: {body: 今天可进入房间维修。, visibility: PUBLIC}
      responses:
        '201':
          description: 留言已创建；可从工单详情的 timeline 中读取。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              examples:
                public:
                  $ref: '#/components/examples/Comment'
                admin_only:
                  value: {kind: COMMENT, id: 2, ticket_id: 1, author: {id: 3, name: 示例管理员, role: ADMIN}, body: 示例内部备注，不下发给其他角色。, visibility: ADMIN_ONLY, created_at: '2026-10-02T08:05:00Z'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/attachments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Attachments]
      operationId: downloadAttachment
      summary: 授权流式下载私有附件
      description: |
        每次下载检查会话和所属工单的资源可见性。不存在或不可见均返回 404。
        存储为私有卷，不提供静态目录 URL。成功响应为原图片字节，不是 JSON。
      responses:
        '200':
          description: 与元数据 MIME 一致的原图片内容。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Content-Disposition:
              description: 安全编码的展示文件名，不能拼接未转义的原始输入。
              schema: {type: string}
            Cache-Control:
              description: 私有附件禁止共享缓存。
              schema: {type: string, example: 'private, no-store'}
          content:
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/locations:
    get:
      tags: [Locations]
      operationId: listActiveLocations
      summary: 查询启用的具体地点用于三级选择
      description: 一条扁平记录对应 building + floor + room_or_area；前端从记录派生级联选项。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/LocationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/locations:
    get:
      tags: [Locations]
      operationId: listAdminLocations
      summary: Admin 查询全部地点
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/LocationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Locations]
      operationId: createLocation
      summary: Admin 创建唯一地点
      description: building + floor + room_or_area 组合唯一；重复返回 409 / CONFLICT，不物理删除地点。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationRequest'
            example: {building: 示例教学楼A, floor: '3', room_or_area: '301', active: true}
      responses:
        '201':
          $ref: '#/components/responses/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/locations/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Locations]
      operationId: updateLocation
      summary: Admin 修改或启停地点
      description: |
        仅更新提供的字段；字段不可为 null，至少提供一个。
        停用后不可创建新工单；修改和停用不更改历史工单的地点快照。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
            example: {active: false}
      responses:
        '200':
          $ref: '#/components/responses/LocationUpdated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Admin 查询 Reporter / Technician 演示账户
      description: |
        账户管理只查询可管理的 REPORTER / TECHNICIAN，不提供 Admin 管理界面。
        分派下拉复用 role=TECHNICIAN&active=true，并读取全部游标页。
        账户管理实现可留到 #49 后期；契约在 #46 中完整描述。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/ManagedRole'
        - name: active
          in: query
          schema: {type: boolean}
      responses:
        '200':
          description: 可管理账户，created_at DESC, id DESC 游标分页。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
              examples:
                technician:
                  $ref: '#/components/examples/UserList'
                empty:
                  value: {items: [], next_cursor: null}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/users/{id}/active:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Users]
      operationId: setUserActive
      summary: Admin 启用或停用 Reporter / Technician
      description: |
        仅 REPORTER / TECHNICIAN 可被管理；Admin 目标（包含本人）返回 403 / FORBIDDEN。
        停用不删除历史。目标账户的已有会话在下一次受保护请求立即返回 401。
        不接受创建账户、角色修改、密码重置等字段。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserActiveRequest'
            example: {active: false}
      responses:
        '200':
          $ref: '#/components/responses/UserActiveUpdated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/analytics:
    get:
      tags: [Analytics]
      operationId: getAnalytics
      summary: Admin 读取真实工单的六组聚合统计
      description: |
        状态、类别、楼宇分布；非终态积压；创建至关闭平均耗时；最近 30 个自然日的创建/关闭趋势。
        PostgreSQL 直接聚合，不使用缓存、物化视图或独立统计服务。
        平均值只计算 status=CLOSED 且 closed_at 非空的工单，单位秒，包含等待确认阶段。
        无关闭样本时平均值为 0，其余空计数为零或空集合（遵循冻结基线空数据规则）。
        daily_trend 为包含今日（Asia/Shanghai）的连续 30 天，升序排列，缺失日期补零。
        stored timestamps 为 UTC，趋势 date 为上海本地 YYYY-MM-DD 日期；此接口不接受自定义时间范围。
      responses:
        '200':
          description: 六组只读统计，空数据库也返回稳定字段结构。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics'
              examples:
                empty:
                  $ref: '#/components/examples/EmptyAnalytics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: campusfix_session
      description: |
        复用 Core 的 Cookie 名称，非 JWT。HttpOnly、SameSite=Lax、Path=/，绝对有效期 8 小时。
        本地 HTTP 外启用 Secure。浏览器使用 credentials，数据库只存令牌哈希。
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Origin:
      name: Origin
      in: header
      required: true
      description: 浏览器自动设置；非浏览器客户端也必须提供配置允许的来源。缺少/不允许均返回 403 / ORIGIN_NOT_ALLOWED。
      schema: {type: string, format: uri, example: 'http://localhost:5173'}
    Cursor:
      name: cursor
      in: query
      description: 不透明游标，省略为第一页；不可解析、篡改或用于不同筛选条件时返回 400 / VALIDATION_ERROR。
      schema: {type: string, minLength: 1}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  headers:
    RequestId:
      description: 服务端生成的排错标识，错误时与 error.request_id 相同。
      schema: {type: string, pattern: '^req_', example: req_example}
    SessionCookie:
      description: 会话 Cookie，Max-Age=28800；非本地 HTTP 设置 Secure。示例不是有效令牌。
      schema: {type: string, example: 'campusfix_session=opaque-demo; Path=/; Max-Age=28800; HttpOnly; SameSite=lax'}
    ClearSessionCookie:
      description: 清除当前 Cookie，保留匹配的 Path 和安全属性。
      schema: {type: string, example: 'campusfix_session=""; Max-Age=0; Path=/; HttpOnly; SameSite=lax'}
  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
      description: 数据库 bigint identity 主键；API 使用 JSON 整数，不与工单展示编号混用。
      example: 1
    Version:
      type: integer
      minimum: 1
      description: 从 1 开始，成功状态转换递增，旧版本动作返回 409。
    UtcDateTime:
      type: string
      format: date-time
      pattern: 'Z$'
      description: ISO 8601 UTC 字符串，统一以 Z 结尾。
      example: '2026-10-02T08:00:00Z'
    Role:
      type: string
      enum: [REPORTER, TECHNICIAN, ADMIN]
    ManagedRole:
      type: string
      enum: [REPORTER, TECHNICIAN]
    TicketStatus:
      type: string
      enum: [SUBMITTED, PENDING_ASSIGNMENT, ASSIGNED, IN_PROGRESS, PENDING_CONFIRMATION, CLOSED, REJECTED, CANCELLED]
    Category:
      type: string
      enum: [LIGHTING_ELECTRICAL, DOORS_WINDOWS_LOCKS, FURNITURE, HVAC, WATER_SANITARY, OTHER_FACILITY]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    Visibility:
      type: string
      enum: [PUBLIC, ADMIN_ONLY]
    AttachmentPurpose:
      type: string
      enum: [REPORT_PHOTO, RESOLUTION_PHOTO]
    EventType:
      type: string
      enum: [TICKET_SUBMITTED, TICKET_APPROVED, TICKET_REJECTED, TICKET_CANCELLED, TICKET_ASSIGNED, WORK_STARTED, RESOLUTION_SUBMITTED, TICKET_CLOSED, REWORK_REQUESTED]
    TicketAction:
      type: string
      enum: [REVIEW, ASSIGN, START, RESOLVE, CONFIRM, REWORK, CANCEL, COMMENT_PUBLIC, COMMENT_ADMIN_ONLY]
    ErrorCode:
      type: string
      description: 与 backend/app/core/errors.py 的 ErrorCode 完全相同，不自行新增业务错误码。
      enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, TICKET_VERSION_CONFLICT, ORIGIN_NOT_ALLOWED, INTERNAL_ERROR]
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message, type]
      properties:
        field: {type: string, description: 点分隔字段路径；复用 Core 的校验结果。}
        message: {type: string}
        type: {type: string}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, field_errors]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message: {type: string}
            request_id: {type: string, pattern: '^req_'}
            field_errors:
              type: array
              description: 仅字段校验错误包含条目；其他错误为 []。
              items:
                $ref: '#/components/schemas/FieldError'
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: ok}
    User:
      type: object
      additionalProperties: false
      required: [id, name, email, role, active, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name: {type: string}
        email: {type: string, format: email}
        role:
          $ref: '#/components/schemas/Role'
        active: {type: boolean}
        created_at:
          $ref: '#/components/schemas/UtcDateTime'
        updated_at:
          $ref: '#/components/schemas/UtcDateTime'
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, name, role]
      description: 工单参与者的最小公开信息，不包含邮箱或账户安全字段。
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name: {type: string}
        role:
          $ref: '#/components/schemas/Role'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 1, writeOnly: true}
    TicketSummary:
      allOf:
        - $ref: '#/components/schemas/TicketFields'
      unevaluatedProperties: false
    TicketFields:
      type: object
      description: |
        工单摘要公共字段。priority 在待分派至 CLOSED 必须非空；其他状态可以为 null。
        current_assignee 从 ASSIGNED 至 CLOSED 必须非空，关闭后保留；分派前为 null。
        只有 CLOSED 设置非空 closed_at；所有其他状态 closed_at 为 null。
        终态 current_responsible_role / next_action 为 null，allowed_actions 为 []。
        allowed_actions 必须按当前登录人、资源关系及状态计算，不能仅按角色计算。
      required: [id, code, reporter, location_id, location_label_snapshot, title, category, priority, status, current_assignee, version, created_at, updated_at, closed_at, current_responsible_role, next_action, allowed_actions]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
          pattern: '^CF-[0-9]{8}-[0-9]{6,}$'
          description: 前 8 位是创建时刻的 Asia/Shanghai 本地日期（YYYYMMDD），与统计趋势日期同一时区。
          example: CF-20261002-000001
        reporter:
          $ref: '#/components/schemas/UserSummary'
        location_id:
          $ref: '#/components/schemas/Id'
        location_label_snapshot: {type: string}
        title: {type: string, minLength: 1, maxLength: 120}
        category:
          $ref: '#/components/schemas/Category'
        priority:
          anyOf:
            - $ref: '#/components/schemas/Priority'
            - type: 'null'
        status:
          $ref: '#/components/schemas/TicketStatus'
        current_assignee:
          anyOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          $ref: '#/components/schemas/UtcDateTime'
        updated_at:
          $ref: '#/components/schemas/UtcDateTime'
        closed_at:
          anyOf:
            - $ref: '#/components/schemas/UtcDateTime'
            - type: 'null'
        current_responsible_role:
          anyOf:
            - $ref: '#/components/schemas/Role'
            - type: 'null'
          description: SUBMITTED/待分派 为 ADMIN；已分派/处理中为 TECHNICIAN；待确认为 REPORTER；终态为 null。
        next_action:
          type: [string, 'null']
          enum: [REVIEW, ASSIGN, START, RESOLVE, CONFIRM_OR_REWORK, null]
          description: 当前责任阶段，终态为 null；与当前用户 allowed_actions 区分。
        allowed_actions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TicketAction'
      allOf:
        - if:
            properties:
              status: {enum: [PENDING_ASSIGNMENT, ASSIGNED, IN_PROGRESS, PENDING_CONFIRMATION, CLOSED]}
            required: [status]
          then:
            properties:
              priority:
                $ref: '#/components/schemas/Priority'
        - if:
            properties:
              status: {enum: [ASSIGNED, IN_PROGRESS, PENDING_CONFIRMATION, CLOSED]}
            required: [status]
          then:
            properties:
              current_assignee:
                allOf:
                  - $ref: '#/components/schemas/UserSummary'
                  - properties:
                      role: {const: TECHNICIAN}
          else:
            properties:
              current_assignee: {type: 'null'}
        - if:
            properties:
              status: {const: CLOSED}
            required: [status]
          then:
            properties:
              closed_at:
                $ref: '#/components/schemas/UtcDateTime'
          else:
            properties:
              closed_at: {type: 'null'}
        - if:
            properties:
              status: {enum: [CLOSED, REJECTED, CANCELLED]}
            required: [status]
          then:
            properties:
              current_responsible_role: {type: 'null'}
              next_action: {type: 'null'}
              allowed_actions: {maxItems: 0}
    TicketDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/TicketFields'
        - type: object
          required: [description, report_photos, resolution_photos, assignments, timeline]
          properties:
            description: {type: string, minLength: 1, maxLength: 4000}
            report_photos:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/Attachment'
            resolution_photos:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/Attachment'
            assignments:
              type: array
              items:
                $ref: '#/components/schemas/Assignment'
            timeline:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/TicketEvent'
                  - $ref: '#/components/schemas/Comment'
                discriminator:
                  propertyName: kind
                  mapping:
                    EVENT: '#/components/schemas/TicketEvent'
                    COMMENT: '#/components/schemas/Comment'
    TicketList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketSummary'
        next_cursor: {type: [string, 'null'], description: 无下一页为 null；有下一页为不透明字符串。}
    Photos:
      type: array
      maxItems: 5
      description: |
        用同名 photos multipart 部件重复上传。JPEG/PNG/WebP；单张最多 5242880 字节。
        后端检查真实 MIME 和可解码性，不相信文件名。损坏图片返回 422，非法类型 415，超大 413，超数量 422。
      items: {type: string, format: binary}
    CreateTicketRequest:
      type: object
      additionalProperties: false
      required: [title, description, category, location_id]
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, minLength: 1, maxLength: 4000}
        category:
          $ref: '#/components/schemas/Category'
        location_id:
          $ref: '#/components/schemas/Id'
        photos:
          $ref: '#/components/schemas/Photos'
    VersionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
    ReviewRequest:
      oneOf:
        - $ref: '#/components/schemas/ApproveRequest'
        - $ref: '#/components/schemas/RejectRequest'
      discriminator:
        propertyName: decision
        mapping:
          APPROVE: '#/components/schemas/ApproveRequest'
          REJECT: '#/components/schemas/RejectRequest'
    ApproveRequest:
      type: object
      additionalProperties: false
      required: [decision, category, priority, expected_version]
      properties:
        decision: {type: string, const: APPROVE}
        category:
          $ref: '#/components/schemas/Category'
        priority:
          $ref: '#/components/schemas/Priority'
        expected_version:
          $ref: '#/components/schemas/Version'
    RejectRequest:
      type: object
      additionalProperties: false
      required: [decision, reason, expected_version]
      properties:
        decision: {type: string, const: REJECT}
        reason: {type: string, minLength: 1}
        expected_version:
          $ref: '#/components/schemas/Version'
    AssignRequest:
      type: object
      additionalProperties: false
      required: [technician_id, expected_version]
      properties:
        technician_id:
          $ref: '#/components/schemas/Id'
        expected_version:
          $ref: '#/components/schemas/Version'
    StartRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        note: {type: string}
        expected_version:
          $ref: '#/components/schemas/Version'
    ResolveRequest:
      type: object
      additionalProperties: false
      required: [resolution_note, expected_version]
      properties:
        resolution_note: {type: string, minLength: 1}
        expected_version:
          $ref: '#/components/schemas/Version'
        photos:
          $ref: '#/components/schemas/Photos'
    ReworkRequest:
      type: object
      additionalProperties: false
      required: [reason, expected_version]
      properties:
        reason: {type: string, minLength: 1}
        expected_version:
          $ref: '#/components/schemas/Version'
    CancelRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        reason: {type: string}
        expected_version:
          $ref: '#/components/schemas/Version'
    CommentRequest:
      type: object
      additionalProperties: false
      required: [body, visibility]
      properties:
        body: {type: string, minLength: 1, maxLength: 2000}
        visibility:
          $ref: '#/components/schemas/Visibility'
    Attachment:
      type: object
      additionalProperties: false
      required: [id, ticket_id, uploader, original_name, mime, size, purpose, created_at, download_url]
      properties:
        id:
          $ref: '#/components/schemas/Id'
